# 🎯 OPTIMIZACIÓN: Reducido de 8G a 2G para dispositivos de gama media-baja
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 🎯 OPTIMIZACIÓN: Habilitar compilación paralela y caché
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 🎯 OPTIMIZACIÓN: Habilitar R8 para minificación y ofuscación
android.enableR8.fullMode=true
