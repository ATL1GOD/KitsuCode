name: kitsucode
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  # 🎯 OPTIMIZACIÓN: Dependencias de animación (reducidas de 11 a 8)
  animate_do: ^4.2.0
  animated_background: ^2.0.0 # ⚠️ Usado en burbujas.dart - considerar optimizar
  curved_navigation_bar: ^1.0.6
  flex_color_scheme: ^8.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.1
  go_router: ^16.1.0
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  lottie: ^3.3.2
  particles_fly: ^0.0.9
  shimmer: ^3.0.0
  simple_animations: ^5.2.0
  supabase_flutter: ^2.9.1
  overlay_support: ^2.1.0
  awesome_snackbar_content: ^0.1.8
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.0.1
  timezone: ^0.10.1
  collection: ^1.19.1
  intl: ^0.20.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  animated_text_kit: ^4.3.0
  flutter_native_splash: ^2.4.7
  connectivity_plus: ^7.0.0
  visibility_detector: ^0.4.0+2
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  android: true
  ios: false
  web: false

  # Fondo general
  color: "#F79126"
  fullscreen: true

  # Config especial Android 12+
  android_12:
    image: assets/images/splash/transparent.png
    icon_background_color: "#F79126"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/logros/
    - assets/images/auth/
    - assets/images/mensual/
    - assets/lottie/
    #- assets/icons/
    #- assets/fonts/
    - assets/.env
    - assets/animations/
    - assets/audio/
    - assets/audio/music/
